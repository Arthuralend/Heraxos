name: Сборка iOS (IPA для установки через Sideloadly/AltStore)

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Сборка без подписи
        run: |
          cd ios
          xcodebuild -project Heraxos.xcodeproj -target Heraxos -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -30
          mkdir -p Payload && cp -R build/Release-iphoneos/Heraxos.app Payload/
          zip -qry ../Heraxos.ipa Payload
          ls -la ../Heraxos.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Heraxos-ipa
          path: Heraxos.ipa
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-1.0.${{ github.run_number }}
          name: Heraxos для iPhone (тестовая) 1.0.${{ github.run_number }}
          body: |
            Неподписанный **Heraxos.ipa** для установки через Sideloadly или AltStore с вашим Apple ID.
            Звонки приходят, пока приложение открыто. Подпись бесплатного Apple ID действует 7 дней.
          files: Heraxos.ipa
          prerelease: true
          make_latest: false
