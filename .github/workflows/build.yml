name: Сборка APK

on:
  push:
    branches: [main]
    paths-ignore: ['ios/**', 'server/**', '.github/workflows/ios.yml', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      # Ключ подписи хранится в секретах репозитория (Settings → Secrets and variables → Actions)
      - name: Ключ подписи
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$PW" ] || { echo "::error::Секрет ANDROID_KEYSTORE_PASSWORD пустой или не добавлен (Settings → Secrets and variables → Actions → Repository secrets)"; exit 1; }
          [ -n "$KS" ] || { echo "::error::Секрет ANDROID_KEYSTORE_B64 пустой или не добавлен (Settings → Secrets and variables → Actions → Repository secrets)"; exit 1; }
          # при вставке строка могла получить пробелы, переносы или лишний текст вокруг —
          # берём самую длинную непрерывную base64-строку
          printf '%s' "$KS" | tr -d '\r\n\t ' | grep -oE '[A-Za-z0-9+/]{200,}={0,2}' | awk '{ if (length($0) > length(m)) m = $0 } END { printf "%s", m }' > ks.b64
          echo "Длина ANDROID_KEYSTORE_B64: $(wc -c < ks.b64) символов (ожидается 5732)"
          base64 -d ks.b64 > app/ahazang.jks 2>/dev/null || { echo "::error::ANDROID_KEYSTORE_B64 испорчен при копировании (не base64). Вставьте строку из файла ANDROID_KEYSTORE_B64.txt целиком"; exit 1; }
          rm ks.b64
          # пароль мог вставиться с пробелами, переносом или соседним текстом — пробуем варианты
          OK=""
          # кандидаты: пароль как есть, без пробелов, «слова» из обоих секретов (если секреты перепутаны или вставлен весь файл)
          for cand in "$PW" "$(printf '%s' "$PW" | tr -d ' \r\n\t')" $( { printf '%s\n' "$PW"; printf '%s\n' "$KS"; } | grep -oE '(^|[^A-Za-z0-9+/=])[A-Za-z0-9]{16,40}($|[^A-Za-z0-9+/=])' | grep -oE '[A-Za-z0-9]{16,40}' | sort -u); do
            if keytool -list -keystore app/ahazang.jks -storepass "$cand" -alias ahazang >/dev/null 2>&1; then OK="$cand"; break; fi
          done
          [ -n "$OK" ] || { echo "::error::Ключ не открывается: в секрете ANDROID_KEYSTORE_PASSWORD неверный пароль (длина $(printf '%s' "$PW" | wc -c) символов, ожидается 24)"; exit 1; }
          echo "::add-mask::$OK"
          echo "KS_PASS=$OK" >> "$GITHUB_ENV"
          echo "Ключ подписи в порядке"
      - name: Сборка
        run: ANDROID_KEYSTORE_PASSWORD="$KS_PASS" gradle assembleRelease --no-daemon --stacktrace
      # Ahazang.apk — новое имя; Heraxos.apk — копия, чтобы старые ссылки продолжали работать
      - run: cp app/build/outputs/apk/release/app-release.apk Ahazang.apk && cp Ahazang.apk Heraxos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ahazang-apk
          path: Ahazang.apk
      # Текст выпуска: список изменений из CHANGES.md (его показывает приложение в «Настройках → Обновление»)
      - name: Описание выпуска
        run: |
          {
            cat CHANGES.md
            echo
            echo '---'
            echo
            echo 'Скачайте **Ahazang.apk** ниже и откройте его на телефоне.'
            echo 'Постоянная ссылка на последнюю версию: https://github.com/${{ github.repository }}/releases/latest/download/Ahazang.apk'
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ahazang для Android 1.0.${{ github.run_number }}
          body_path: release-notes.md
          files: |
            Ahazang.apk
            Heraxos.apk
          make_latest: true
