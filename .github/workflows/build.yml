name: Сборка APK

on:
  push:
    branches: [main]
    paths-ignore: ['ios/**', 'server/**', '.github/workflows/ios.yml', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      # Ключ подписи хранится в секретах репозитория (Settings → Secrets and variables → Actions)
      - name: Ключ подписи
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KS$PW" ] || { echo "::error::Секреты ANDROID_KEYSTORE_B64 и ANDROID_KEYSTORE_PASSWORD пустые (Settings → Secrets and variables → Actions)"; exit 1; }
          # Ключ и пароль ищем в ОБОИХ секретах: их могли перепутать или вставить вместе с текстом инструкции.
          ALL=$(printf '%s\n%s\n' "$KS" "$PW")
          # ключ — самая длинная непрерывная base64-строка
          { printf '%s' "$KS" | tr -d '\r\n\t ' | grep -oE '[A-Za-z0-9+/]{200,}={0,2}'; echo; printf '%s' "$PW" | tr -d '\r\n\t ' | grep -oE '[A-Za-z0-9+/]{200,}={0,2}'; } \
            | awk '{ if (length($0) > length(m)) m = $0 } END { printf "%s", m }' > ks.b64
          echo "Длина найденного ключа: $(wc -c < ks.b64) символов (ожидается 5732)"
          [ -s ks.b64 ] || { echo "::error::Ключ не найден ни в одном секрете. Вставьте в ANDROID_KEYSTORE_B64 строку из файла ANDROID_KEYSTORE_B64.txt"; exit 1; }
          base64 -d ks.b64 > app/ahazang.jks 2>/dev/null || { echo "::error::Ключ испорчен при копировании. Вставьте строку из файла ANDROID_KEYSTORE_B64.txt целиком"; exit 1; }
          rm ks.b64
          # пароль — пробуем секреты как есть, без пробелов и каждое «слово» 16–40 символов из обоих
          OK=""
          for cand in "$PW" "$KS" "$(printf '%s' "$PW" | tr -d ' \r\n\t')" "$(printf '%s' "$KS" | tr -d ' \r\n\t')" \
              $(printf '%s\n' "$ALL" | grep -oE '(^|[^A-Za-z0-9+/=])[A-Za-z0-9]{16,40}($|[^A-Za-z0-9+/=])' | grep -oE '[A-Za-z0-9]{16,40}' | sort -u); do
            [ -n "$cand" ] || continue
            if keytool -list -keystore app/ahazang.jks -storepass "$cand" -alias ahazang >/dev/null 2>&1; then OK="$cand"; break; fi
          done
          [ -n "$OK" ] || { echo "::error::Пароль ключа не найден. В ANDROID_KEYSTORE_PASSWORD должно быть: пароль из 24 символов"; exit 1; }
          echo "::add-mask::$OK"
          echo "KS_PASS=$OK" >> "$GITHUB_ENV"
          echo "Ключ подписи в порядке"
      - name: Сборка
        run: ANDROID_KEYSTORE_PASSWORD="$KS_PASS" gradle assembleRelease --no-daemon --stacktrace
      # Ahazang.apk — новое имя; Heraxos.apk — копия, чтобы старые ссылки продолжали работать
      - run: cp app/build/outputs/apk/release/app-release.apk Ahazang.apk && cp Ahazang.apk Heraxos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ahazang-apk
          path: Ahazang.apk
      # Текст выпуска: список изменений из CHANGES.md (его показывает приложение в «Настройках → Обновление»)
      - name: Описание выпуска
        run: |
          {
            cat CHANGES.md
            echo
            echo '---'
            echo
            echo 'Скачайте **Ahazang.apk** ниже и откройте его на телефоне.'
            echo 'Постоянная ссылка на последнюю версию: https://github.com/${{ github.repository }}/releases/latest/download/Ahazang.apk'
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ahazang для Android 1.0.${{ github.run_number }}
          body_path: release-notes.md
          files: |
            Ahazang.apk
            Heraxos.apk
          make_latest: true
