name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Сборка
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk Heraxos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Heraxos-apk
          path: Heraxos.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Heraxos для Android 1.0.${{ github.run_number }}
          body: |
            Скачайте **Heraxos.apk** ниже и откройте его на телефоне.
            Постоянная ссылка на последнюю версию: https://github.com/${{ github.repository }}/releases/latest/download/Heraxos.apk
          files: Heraxos.apk
          make_latest: true
