name: Сборка APK

on:
  push:
    branches: [main]
    paths-ignore: ['ios/**', 'server/**', '.github/workflows/ios.yml', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      # Ключ подписи хранится в секретах репозитория (Settings → Secrets and variables → Actions)
      - name: Ключ подписи
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Нет секрета ANDROID_KEYSTORE_B64 (ключ подписи Android) — см. README"; exit 1; fi
          echo "$KS" | base64 -d > app/ahazang.jks
      - name: Сборка
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      # Ahazang.apk — новое имя; Heraxos.apk — копия, чтобы старые ссылки продолжали работать
      - run: cp app/build/outputs/apk/release/app-release.apk Ahazang.apk && cp Ahazang.apk Heraxos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ahazang-apk
          path: Ahazang.apk
      # Текст выпуска: список изменений из CHANGES.md (его показывает приложение в «Настройках → Обновление»)
      - name: Описание выпуска
        run: |
          {
            cat CHANGES.md
            echo
            echo '---'
            echo
            echo 'Скачайте **Ahazang.apk** ниже и откройте его на телефоне.'
            echo 'Постоянная ссылка на последнюю версию: https://github.com/${{ github.repository }}/releases/latest/download/Ahazang.apk'
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ahazang для Android 1.0.${{ github.run_number }}
          body_path: release-notes.md
          files: |
            Ahazang.apk
            Heraxos.apk
          make_latest: true
