name: Heraxos
options:
  bundleIdPrefix: am.ahazang
  deploymentTarget:
    iOS: "15.0"
packages:
  # WebRTC (сборка Google WebRTC для iOS) — нативные звонки
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: "158.0.0"
targets:
  Heraxos:
    type: application
    platform: iOS
    sources: [Heraxos]
    scheme: {}
    dependencies:
      - package: WebRTC
    entitlements:
      path: Heraxos/Heraxos.entitlements
      properties:
        aps-environment: development   # при выгрузке в TestFlight Xcode сам заменит на production
    info:
      path: Heraxos/Info.plist
      properties:
        CFBundleDisplayName: Ahazang
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBg
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIBackgroundModes: [audio, voip]
        NSCameraUsageDescription: "Камера нужна для видеозвонков Ahazang"
        NSMicrophoneUsageDescription: "Микрофон нужен для звонков Ahazang"
        NSPhotoLibraryUsageDescription: "Доступ к фото нужен, чтобы отправлять снимки и видео в чат"
        NSPhotoLibraryAddUsageDescription: "Доступ нужен, чтобы сохранять полученные фото и видео"
        # сквозное шифрование сообщений (ECDH + AES-GCM) и звонков (DTLS-SRTP) — стандартные алгоритмы;
        # в App Store Connect при каждой сборке: «стандартное шифрование», освобождение mass market
        ITSAppUsesNonExemptEncryption: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: am.ahazang.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"   # только iPhone (iPad не поддерживается)
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        # для TestFlight подпись включает сборка на GitHub (ios-testflight.yml): CODE_SIGNING_ALLOWED=YES + DEVELOPMENT_TEAM
        CODE_SIGN_STYLE: Automatic
